<!DOCTYPE html>
<html lang="en">

<head>
  <title>Divyam - Developer Website</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      background-color: rgb(2, 2, 45);
      color: white;
    }

    nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 70px;
      background-color: rgb(4, 4, 81);
    }

    nav ul {
      display: flex;
      list-style: none;
    }

    nav ul li {
      padding: 20px;
    }
    nav ul li a {
      text-decoration: none;
      color: white;
    }
    nav ul li a:hover{
      color : rgb(119, 119, 199)
    }

    .Left {
      font-size: 1.5rem;
      font-weight: bold;
    }
    .Firstsection {
    display: flex;
    justify-content:space-around;
    margin: 23px 0px;
    }
    .Firstsection > div {
      width: 30%;
    }
    .leftsection {
      font-size: 2.8rem;
      font-weight:bolder;
      align-items: center;
      margin:9rem 0px;
    }
    .rightsection img {
      width: 80%;
      margin: 10px 0px;
    }
    .purple {
      color:rgba(179, 27, 235, 0.895);
    }
    #element {
      color : rgb(137, 50, 148)
    }
  </style>
</head>

<body>
  <header>
    <nav>
      <div class="Left"> Divyam's Portfolio</div>
      <div class="Right">
        <ul>
          <li><a href="#home">Home</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#services">Services</a></li>
          <li><a href="#projects">Projects</a></li>
          <li><a href="#contact">Contact Me</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main>
    <section class="Firstsection">

    <div class="leftsection">
      Hi, My name is <span class="purple">Divyam</span> 
      <div> and I am a passionate</div>
       <span id="element"></span>
    </div>
    <div class="rightsection">
      <img src="developer.png.png" alt="">
    </div>
    </section>
  </main>
  <script src="https://unpkg.com/typed.js@3.0.0/dist/typed.umd.js"></script>
   <!-- Setup and start animation! -->
  <script>
    var typed = new Typed('#element', {
      strings: ['Web Developer', 'Software Engineer' , 'Problem Solver', 'Tech Enthusiast.'],
      typeSpeed: 50
    });
  </script>
</body>

</html>
